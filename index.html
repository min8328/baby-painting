<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>아기 색칠공부</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #f6e7cf;
      color: #3b2a1a;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      user-select: none;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: #f6e7cf;
    }
    .app:fullscreen,
    .app:-webkit-full-screen {
      background: #f6e7cf;
      width: 100%;
      height: 100%;
    }
    .app:fullscreen::backdrop,
    .app:-webkit-full-screen::backdrop {
      background: #f6e7cf;
    }
    .sheet { min-height: 0; flex: 1; padding: 16px 16px 8px; }
    .frame {
      position: relative;
      height: 100%;
      width: 100%;
      overflow: hidden;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(90, 50, 20, 0.12);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: none;
    }
    .dot {
      position: absolute;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 0 1.5px #2a2118;
    }
    .brush {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      width: 144px;
      height: 144px;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 2px 1px rgba(42, 33, 24, 0.35));
    }
    .palette { display: flex; flex-direction: column; gap: 12px; padding: 8px 24px 20px; }
    .palette-row { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; }
    .color-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; width: 100%; order: 1; }
    .tool-grid { display: grid; grid-template-columns: repeat(4, 68px); gap: 8px; order: 2; }
    button {
      border: 0;
      padding: 0;
      background: #fff;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .swatch {
      width: 100%;
      max-width: 148px;
      aspect-ratio: 1;
      justify-self: center;
      border-radius: 999px;
      border: 4px solid rgba(0, 0, 0, 0.15);
    }
    .swatch[aria-pressed="true"] {
      border-color: #2a2118;
      box-shadow: 0 0 0 6px rgba(42, 33, 24, 0.25);
    }
    .tool {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      display: grid;
      place-items: center;
    }
    .tool svg { width: 28px; height: 28px; }
    .tool.primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .tool:disabled { opacity: 0.45; }
    .tool .brush-thumb { width: 46px; height: 46px; }
    .brush-thumb.off { display: none !important; }
    .tool.holding { transform: scale(0.94); }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(42, 33, 24, 0.45);
    }
    .modal[hidden] { display: none; }
    .modal-card {
      width: min(920px, 100%);
      max-height: min(82dvh, 760px);
      overflow: auto;
      padding: 16px;
      border-radius: 24px;
      background: #fffdf8;
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-head h2 { margin: 0; font-size: 28px; font-weight: 400; }
    .modal-close {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f6e7cf;
      font-size: 24px;
    }
    .template-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .template-grid button {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      border: 3px solid #efd3a4;
      border-radius: 16px;
      background: #fff;
    }
    .template-grid svg { width: 100%; height: 92px; }
    .template-grid span { font-size: 16px; }
    @media (max-width: 700px) {
      .template-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .app.is-fullscreen, .app.is-fullscreen * { cursor: none !important; }
    @media (min-width: 900px) {
      .palette-row { flex-direction: row; }
      .color-grid { order: 0; grid-template-columns: repeat(10, minmax(0, 1fr)); min-width: 0; flex: 1; }
      .tool-grid { order: 0; grid-template-columns: repeat(2, 68px); }
    }
    .app[data-layout="mobile-landscape"] .sheet { padding: 8px 8px 4px; }
    .app[data-layout="mobile-landscape"] .palette { padding: 4px 10px 8px; }
    .app[data-layout="mobile-landscape"] .palette-row { flex-direction: row; align-items: center; gap: 8px; }
    .app[data-layout="mobile-landscape"] .color-grid { order: 0; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
    .app[data-layout="mobile-landscape"] .swatch {
      width: min(100%, 20vh);
      height: min(100%, 20vh);
      max-width: 76px;
      max-height: 76px;
      border-width: 3px;
    }
    .app[data-layout="mobile-landscape"] .tool-grid { order: 0; grid-template-columns: repeat(2, 42px); gap: 4px; }
    .app[data-layout="mobile-landscape"] .tool { width: 42px; height: 42px; border-radius: 12px; }
    .app[data-layout="mobile-landscape"] .tool svg { width: 20px; height: 20px; }
    .app[data-layout="mobile-landscape"] .tool .brush-thumb { width: 30px; height: 30px; }
  </style>
</head>

      { id: "blue", name: "파랑", hex: "#2F6BFF" },
      { id: "navy", name: "남색", hex: "#1B2A7A" },
      { id: "purple", name: "보라", hex: "#8B3DFF" },
      { id: "pink", name: "분홍", hex: "#FF4FA3" },
      { id: "black", name: "검정", hex: "#1A1A1A" },
      { id: "white", name: "하양", hex: "#FFFFFF" }
    ];

    const app = document.getElementById("app");
    const frame = document.getElementById("frame");
    const canvas = document.getElementById("paint");
    const dot = document.getElementById("dot");
    const brush = document.getElementById("brush");
    const undoButton = document.getElementById("undo");
    const newPaperButton = document.getElementById("new-paper");
    const templatesButton = document.getElementById("templates-button");
    const templateModal = document.getElementById("template-modal");

    const state = { image: null, lines: null, undo: [] };
    let lineCanvas = null;
    let color = COLORS[0];
    let thick = false;
    let drawing = false;
    let lastPoint = null;
    let raf = 0;
    let mobile = false;

    function isMobileDevice() {
      const ua = navigator.userAgent;
      if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) return true;
      return matchMedia("(pointer: coarse)").matches && matchMedia("(hover: none)").matches;
    }
    function isMobileChrome() {
      const ua = navigator.userAgent;
      if (/CriOS/i.test(ua)) return true;
      return /Android/i.test(ua) && /Chrome\/\d/i.test(ua) && !/EdgA|OPR|SamsungBrowser|DuckDuckGo/i.test(ua);
    }
    function hexToRgb(hex) {
      return { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) };
    }
    function fillBuffer(data) {
      for (let i = 0; i < data.length; i += 4) {
        data[i] = 255; data[i + 1] = 255; data[i + 2] = 255; data[i + 3] = 255;
      }
    }
    function contentBounds(data, width, height) {
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          if (data[i] === 255 && data[i + 1] === 255 && data[i + 2] === 255) continue;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      if (maxX < 0) return null;
      return { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
    }
    function contentBoundsAlpha(data, width, height) {
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (data[(y * width + x) * 4 + 3] === 0) continue;
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
      }
      if (maxX < 0) return null;
      return { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
    }
    function unionBounds(a, b) {
      if (!a) return b;
      if (!b) return a;
      const minX = Math.min(a.minX, b.minX);
      const minY = Math.min(a.minY, b.minY);
      const maxX = Math.max(a.maxX, b.maxX);
      const maxY = Math.max(a.maxY, b.maxY);
      return { minX, minY, maxX, maxY, width: maxX - minX + 1, height: maxY - minY + 1 };
    }
    function fitPaper(bounds, sourceWidth, sourceHeight, destWidth, destHeight) {
      if (!bounds) return { scale: 1, offsetX: (destWidth - sourceWidth) / 2, offsetY: (destHeight - sourceHeight) / 2 };
      const scale = Math.min(1, destWidth / bounds.width, destHeight / bounds.height);
      const centerX = (bounds.minX + bounds.maxX + 1) / 2;
      const centerY = (bounds.minY + bounds.maxY + 1) / 2;
      return { scale, offsetX: destWidth / 2 - centerX * scale, offsetY: destHeight / 2 - centerY * scale };
    }
    function resamplePaper(source, sourceWidth, sourceHeight, destWidth, destHeight, fit, keepAlpha) {
      const dest = new Uint8ClampedArray(destWidth * destHeight * 4);
      if (!keepAlpha) fillBuffer(dest);
      for (let y = 0; y < destHeight; y++) {
        const sy = Math.round((y + 0.5 - fit.offsetY) / fit.scale - 0.5);
        if (sy < 0 || sy >= sourceHeight) continue;
        for (let x = 0; x < destWidth; x++) {
          const sx = Math.round((x + 0.5 - fit.offsetX) / fit.scale - 0.5);
          if (sx < 0 || sx >= sourceWidth) continue;
          const si = (sy * sourceWidth + sx) * 4;
          if (keepAlpha && source[si + 3] === 0) continue;
          const di = (y * destWidth + x) * 4;
          dest[di] = source[si]; dest[di + 1] = source[si + 1]; dest[di + 2] = source[si + 2];
          dest[di + 3] = keepAlpha ? source[si + 3] : 255;
        }
      }
      return dest;
    }
    function stampCircle(data, width, height, x, y, radius, rgb) {
      if (radius <= 0) return;
      const r2 = radius * radius;
      const minX = Math.max(0, Math.floor(x - radius));
      const maxX = Math.min(width - 1, Math.ceil(x + radius));
      const minY = Math.max(0, Math.floor(y - radius));
      const maxY = Math.min(height - 1, Math.ceil(y + radius));
      for (let py = minY; py <= maxY; py++) {
        const dy = py + 0.5 - y;
        for (let px = minX; px <= maxX; px++) {
          const dx = px + 0.5 - x;
          if (dx * dx + dy * dy <= r2) {
            const i = (py * width + px) * 4;
            data[i] = rgb.r; data[i + 1] = rgb.g; data[i + 2] = rgb.b; data[i + 3] = 255;
          }
        }
      }
    }
    function strokeCircle(data, width, height, x0, y0, x1, y1, radius, rgb) {
      const dx = x1 - x0, dy = y1 - y0;
      const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy)));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        stampCircle(data, width, height, x0 + dx * t, y0 + dy * t, radius, rgb);
      }
    }
    function brushDiameter() {
      const base = mobile ? BRUSH_DIAMETER / 2 : BRUSH_DIAMETER;
      return thick ? base * 2.5 : base;
    }
    function brushTipOffset() {
      const scale = 144 / 128;
      return { x: 18 * scale, y: 116 * scale };
    }
    function syncBrushMode() {
      document.getElementById("brush-thin").style.display = thick ? "none" : "";
      document.getElementById("brush-wide").style.display = thick ? "" : "none";
      document.querySelector("#brush-mode .thin").classList.toggle("off", !thick);
      document.querySelector("#brush-mode .wide").classList.toggle("off", thick);
      const brushMode = document.getElementById("brush-mode");
      brushMode.setAttribute("aria-pressed", thick ? "true" : "false");
      brushMode.setAttribute("aria-label", thick ? "얇은 붓" : "굵은 붓");
    }
    function radius() {
      const image = state.image;
      if (!image) return brushDiameter() / 2;
      const display = canvas.getBoundingClientRect().width;
      if (display <= 0) return brushDiameter() / 2;
      return (brushDiameter() / 2) * (image.width / display);
    }
    function syncLineCanvas() {
      const image = state.image;
      if (!image || !state.lines || state.lines.length !== image.width * image.height * 4) {
        lineCanvas = null;
        return;
      }
      if (!lineCanvas) lineCanvas = document.createElement("canvas");
      lineCanvas.width = image.width;
      lineCanvas.height = image.height;
      lineCanvas.getContext("2d").putImageData(new ImageData(state.lines, image.width, image.height), 0, 0);
    }
    function blit() {
      const image = state.image;
      if (!image) return;
      const ctx = canvas.getContext("2d");
      if (canvas.width !== image.width || canvas.height !== image.height) {
        canvas.width = image.width;
        canvas.height = image.height;
      }
      ctx.putImageData(image, 0, 0);
      if (lineCanvas && lineCanvas.width === image.width && lineCanvas.height === image.height) {
        ctx.drawImage(lineCanvas, 0, 0);
      }
    }
    function remember() {
      if (!state.image) return;
      state.undo.push({ paint: state.image.data.slice(), lines: state.lines });
      if (state.undo.length > MAX_UNDO) state.undo.shift();
      undoButton.disabled = false;
    }
    function resizeToFrame() {
      const width = Math.max(1, Math.round(frame.clientWidth));
      const height = Math.max(1, Math.round(frame.clientHeight));
      const current = state.image;
      if (current && current.width === width && current.height === height) return;
      const next = new ImageData(width, height);
      fillBuffer(next.data);
      let nextLines = null;
      if (current && mobile) {
        const bounds = unionBounds(
          contentBounds(current.data, current.width, current.height),
          state.lines ? contentBoundsAlpha(state.lines, current.width, current.height) : null
        );
        const fit = fitPaper(bounds, current.width, current.height, width, height);
        next.data.set(resamplePaper(current.data, current.width, current.height, width, height, fit));
        if (state.lines) nextLines = resamplePaper(state.lines, current.width, current.height, width, height, fit, true);
        state.undo = state.undo.flatMap((snapshot) => {
          if (!snapshot.paint || snapshot.paint.length !== current.width * current.height * 4) return [];
          return [{
            paint: resamplePaper(snapshot.paint, current.width, current.height, width, height, fit),
            lines: snapshot.lines ? resamplePaper(snapshot.lines, current.width, current.height, width, height, fit, true) : null
          }];
        });
      } else if (current) {
        const source = document.createElement("canvas");
        source.width = current.width; source.height = current.height;
        source.getContext("2d").putImageData(current, 0, 0);
        const dest = document.createElement("canvas");
        dest.width = width; dest.height = height;
        const destCtx = dest.getContext("2d");
        destCtx.fillStyle = "#fff";
        destCtx.fillRect(0, 0, width, height);
        destCtx.imageSmoothingEnabled = false;
        destCtx.drawImage(source, 0, 0, width, height);
        next.data.set(destCtx.getImageData(0, 0, width, height).data);
        if (state.lines && state.lines.length === current.width * current.height * 4) {
          const lineSource = document.createElement("canvas");
          lineSource.width = current.width; lineSource.height = current.height;
          lineSource.getContext("2d").putImageData(new ImageData(state.lines, current.width, current.height), 0, 0);
          const lineDest = document.createElement("canvas");
          lineDest.width = width; lineDest.height = height;
          const lineCtx = lineDest.getContext("2d");
          lineCtx.imageSmoothingEnabled = false;
          lineCtx.drawImage(lineSource, 0, 0, width, height);
          nextLines = lineCtx.getImageData(0, 0, width, height).data;
        }
        state.undo = state.undo.filter((snapshot) => snapshot.paint && snapshot.paint.length === width * height * 4);
      }
      state.image = next;
      state.lines = nextLines;
      undoButton.disabled = state.undo.length === 0;
      syncLineCanvas();
      blit();
    }
    function chooseColor(next) {
      color = next;
      document.querySelectorAll(".brush-color").forEach((part) => part.setAttribute("fill", next.hex));
      dot.style.background = next.hex;
      document.querySelectorAll(".swatch").forEach((button) => {
        button.setAttribute("aria-pressed", button.dataset.id === next.id ? "true" : "false");
      });
    }
    function toBuffer(event) {
      const rect = canvas.getBoundingClientRect();
      const image = state.image;
      if (!image) return { x: 0, y: 0 };
      return {
        x: ((event.clientX - rect.left) / rect.width) * image.width,
        y: ((event.clientY - rect.top) / rect.height) * image.height
      };
    }
    function paintSegment(from, to) {
      const image = state.image;
      if (!image) return;
      strokeCircle(image.data, image.width, image.height, from.x, from.y, to.x, to.y, radius(), hexToRgb(color.hex));
    }
    function scheduleBlit() {
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = 0; blit(); });
    }
    function placeBrush(event) {
      const touch = event.pointerType === "touch" || event.pointerType === "pen";
      const show = touch || mobile || document.fullscreenElement === app;
      brush.style.opacity = show ? "1" : "0";
      if (!show) return;
      const tip = brushTipOffset();
      brush.style.transform = "translate(" + (event.clientX - tip.x) + "px," + (event.clientY - tip.y) + "px)";
    }
    function keepTouchBrush(event) {
      if (event.pointerType === "touch" || event.pointerType === "pen") placeBrush(event);
    }
    function moveDot(event) {
      if (document.fullscreenElement === app || event.pointerType === "touch" || event.pointerType === "pen" || mobile) {
        dot.style.opacity = "0";
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const inside = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
      const diameter = brushDiameter();
      dot.style.opacity = inside ? "1" : "0";
      dot.style.width = diameter + "px";
      dot.style.height = diameter + "px";
      dot.style.background = color.hex;
      dot.style.transform = "translate(" + (event.clientX - rect.left - diameter / 2) + "px," + (event.clientY - rect.top - diameter / 2) + "px)";
    }
    function restoreSnapshot(previous) {
      if (!previous || !state.image || previous.paint.length !== state.image.data.length) return false;
      state.image.data.set(previous.paint);
      state.lines = previous.lines;
      syncLineCanvas();
      blit();
      return true;
    }
    function pointerDown(event) {
      if (event.button !== 0 || !state.image) return;
      canvas.setPointerCapture(event.pointerId);
      remember();
      drawing = true;
      const point = toBuffer(event);
      lastPoint = point;
      paintSegment(point, point);
      moveDot(event);
      scheduleBlit();
    }
    function pointerMove(event) {
      placeBrush(event);
      moveDot(event);
      if (!drawing || !lastPoint) return;
      const samples = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
      let prev = lastPoint;
      samples.forEach((sample) => {
        const point = toBuffer(sample);
        paintSegment(prev, point);
        prev = point;
      });
      lastPoint = prev;
      scheduleBlit();
    }
    function endDraw() {
      if (!drawing) return;
      drawing = false;
      lastPoint = null;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      blit();
    }
    function updateLayout() {
      mobile = isMobileDevice();
      const landscape = matchMedia("(orientation: landscape)").matches;
      app.dataset.layout = isMobileChrome() && landscape ? "mobile-landscape" : "default";
      resizeToFrame();
    }
    function setFullscreenUi() {
      const on = document.fullscreenElement === app;
      app.classList.toggle("is-fullscreen", on);
    }
    function blankPaper() {
      if (!state.image) return;
      remember();
      fillBuffer(state.image.data);
      state.lines = null;
      syncLineCanvas();
      blit();
    }
    function saveDrawing() {
      if (!state.image) return;
      const out = document.createElement("canvas");
      out.width = state.image.width;
      out.height = state.image.height;
      const outCtx = out.getContext("2d");
      outCtx.putImageData(state.image, 0, 0);
      if (lineCanvas) outCtx.drawImage(lineCanvas, 0, 0);
      out.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "색칠.png";
        link.click();
        URL.revokeObjectURL(url);
      }, "image/png");
    }
    function toggleFullscreen() {
      const request = document.fullscreenElement ? document.exitFullscreen() : app.requestFullscreen();
      request.catch(() => {});
    }
    function applyTemplate(svg) {
      const img = new Image();
      img.onload = () => {
        if (!state.image) return;
        const width = state.image.width;
        const height = state.image.height;
        const board = document.createElement("canvas");
        board.width = width;
        board.height = height;
        const ctx = board.getContext("2d");
        const scale = Math.min(width / img.width, height / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        ctx.drawImage(img, (width - dw) / 2, (height - dh) / 2, dw, dh);
        const drawn = ctx.getImageData(0, 0, width, height).data;
        const lines = new Uint8ClampedArray(drawn.length);
        for (let i = 0; i < drawn.length; i += 4) {
          if (drawn[i + 3] === 0) continue;
          lines[i] = drawn[i];
          lines[i + 1] = drawn[i + 1];
          lines[i + 2] = drawn[i + 2];
          lines[i + 3] = drawn[i + 3];
        }
        remember();
        fillBuffer(state.image.data);
        state.lines = lines;
        syncLineCanvas();
        blit();
        templateModal.hidden = true;
      };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    COLORS.forEach((item, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "swatch";
      button.dataset.id = item.id;
      button.style.background = item.hex;
      button.setAttribute("aria-label", item.name);
      button.setAttribute("aria-pressed", index === 0 ? "true" : "false");
      button.setAttribute("data-testid", "color-" + item.id);
      button.addEventListener("click", () => chooseColor(item));
      document.getElementById("colors").appendChild(button);
    });

    canvas.addEventListener("pointerdown", pointerDown);
    canvas.addEventListener("pointermove", pointerMove);
    canvas.addEventListener("pointerup", endDraw);
    canvas.addEventListener("pointercancel", endDraw);
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    app.addEventListener("pointerdown", placeBrush);
    app.addEventListener("pointermove", placeBrush);
    app.addEventListener("pointerup", keepTouchBrush);
    app.addEventListener("pointercancel", keepTouchBrush);
    app.addEventListener("pointerleave", (event) => {
      if (event.pointerType === "touch" || event.pointerType === "pen" || mobile) return;
      brush.style.opacity = "0";
    });
    undoButton.addEventListener("click", () => {
      const previous = state.undo.pop();
      if (!restoreSnapshot(previous)) return;
      undoButton.disabled = state.undo.length === 0;
    });
    document.getElementById("brush-mode").addEventListener("click", () => {
      thick = !thick;
      syncBrushMode();
    });
    let paperHoldTimer = 0;
    let paperHoldFired = false;
    let ignorePaperClick = false;
    function stopPaperHold() {
      if (paperHoldTimer) {
        clearTimeout(paperHoldTimer);
        paperHoldTimer = 0;
      }
      newPaperButton.classList.remove("holding");
    }
    newPaperButton.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      paperHoldFired = false;
      ignorePaperClick = false;
      newPaperButton.setPointerCapture(event.pointerId);
      newPaperButton.classList.add("holding");
      paperHoldTimer = setTimeout(() => {
        paperHoldTimer = 0;
        paperHoldFired = true;
        newPaperButton.classList.remove("holding");
        saveDrawing();
      }, 2000);
    });
    newPaperButton.addEventListener("pointerup", () => {
      if (paperHoldFired) ignorePaperClick = true;
      stopPaperHold();
    });
    newPaperButton.addEventListener("pointercancel", () => {
      paperHoldFired = false;
      stopPaperHold();
    });
    newPaperButton.addEventListener("click", () => {
      if (ignorePaperClick) {
        ignorePaperClick = false;
        return;
      }
      blankPaper();
    });
    newPaperButton.addEventListener("contextmenu", (event) => event.preventDefault());
    let templateHoldTimer = 0;
    let templateHoldReady = false;
    let ignoreTemplateClick = false;
    templatesButton.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      templateHoldReady = false;
      ignoreTemplateClick = false;
      templatesButton.setPointerCapture(event.pointerId);
      templatesButton.classList.add("holding");
      templateHoldTimer = setTimeout(() => {
        templateHoldTimer = 0;
        templateHoldReady = true;
        ignoreTemplateClick = true;
        templatesButton.classList.remove("holding");
        toggleFullscreen();
      }, 2000);
    });
    templatesButton.addEventListener("pointerup", () => {
      if (templateHoldTimer) {
        clearTimeout(templateHoldTimer);
        templateHoldTimer = 0;
      }
      templatesButton.classList.remove("holding");
    });
    templatesButton.addEventListener("pointercancel", () => {
      if (templateHoldTimer) clearTimeout(templateHoldTimer);
      templateHoldTimer = 0;
      templateHoldReady = false;
      templatesButton.classList.remove("holding");
    });
    templatesButton.addEventListener("click", () => {
      if (ignoreTemplateClick) {
        ignoreTemplateClick = false;
        return;
      }
      templateModal.hidden = false;
    });
    templatesButton.addEventListener("contextmenu", (event) => event.preventDefault());
    document.getElementById("template-grid").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      applyTemplate(new XMLSerializer().serializeToString(button.querySelector("svg")));
    });
    document.getElementById("template-close").addEventListener("click", () => { templateModal.hidden = true; });
    templateModal.addEventListener("click", (event) => {
      if (event.target === templateModal) templateModal.hidden = true;
    });
    document.addEventListener("fullscreenchange", setFullscreenUi);
    window.addEventListener("keydown", (event) => {
      if (event.repeat && event.code !== "KeyZ") return;
      const digit = /^(?:Digit|Numpad)([1-9])$/.exec(event.code);
      if (digit) { event.preventDefault(); chooseColor(COLORS[Number(digit[1]) - 1]); }
      else if (event.code === "KeyZ") { event.preventDefault(); undoButton.click(); }
      else if (event.code === "KeyF") { event.preventDefault(); toggleFullscreen(); }
    });
    window.addEventListener("resize", updateLayout);
    matchMedia("(orientation: landscape)").addEventListener("change", updateLayout);
    new ResizeObserver(resizeToFrame).observe(frame);
    syncBrushMode();
    updateLayout();
  </script>
</body>
</html>
